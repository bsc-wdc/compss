workflow:
  auto_cancel:
    on_job_failure: all

variables:
  CACHE_IMAGE: "${CI_REGISTRY_IMAGE}/cache"
  TESTS_IMAGE: "${CI_REGISTRY_IMAGE}/tests"
  REGISTRY_API: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/registry/repositories"
  BUILDX_BUILDER: "container-builder"
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"

.gitlab_registry:
  before_script:
    - docker login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"

##########################
# CONTINUOUS INTEGRATION #
##########################

.merge_request:
  tags:
    - fast-docker
  interruptible: true
  rules:
    - if: $CI_MERGE_REQUEST_DRAFT == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH

# Ends the job with success when the MR changes only documentation (Markdown
# and the root text files). The pipeline still passes, so the MR can merge.
# Any doubt (fetch or diff failure, empty diff) runs the job.
.docs_only_skip:
  script:
    - |
      git fetch -q origin "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}" || true
      changed=$(git diff --name-only "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}" HEAD 2>/dev/null) || changed=""
      if [ -n "${changed}" ] && ! echo "${changed}" | grep -qvE '\.md$|^(RELEASE_NOTES|changelog|ACKNOWLEDGMENTS|NOTICE|CITATION\.cff)$'; then
        echo "Only documentation changed, skipping ${CI_JOB_NAME}:"
        echo "${changed}"
        exit 0
      fi

build:
  stage: build
  extends:
    - .gitlab_registry
    - .merge_request
  tags:
    - fast-docker
  script:
    - exec &> >(tee job.log)
    - !reference [.docs_only_skip, script]
    - docker bake --set tests.cache-from=type=registry,ref="${CACHE_IMAGE}:${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
                  --set tests.cache-from=type=registry,ref="${CACHE_IMAGE}:${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
                  --set tests.cache-to=type=registry,ref="${CACHE_IMAGE}:${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}",mode=max
                  --set tests.tags="${TESTS_IMAGE}:${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
                  --push tests
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - job.log

check:
  stage: test
  needs: []
  extends:
    - .merge_request
  script:
    - git remote set-url origin "https://oauth2:${CI_PUSH_TOKEN}@${CI_REPOSITORY_URL#*@}"
    - | # GIT REBASE
      git fetch origin "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
      if [ "${CI_MERGE_REQUEST_SOURCE_PROJECT_ID}" != "${CI_PROJECT_ID}" ]; then
        # Fork MR: runner has no write access to source branch — verify only
        if ! git merge-base --is-ancestor "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}" HEAD; then
          echo "ERROR: Branch is not rebased on ${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}."
          echo "Please rebase and push again."
          exit 1
        fi
      else
        # Same-repo MR: auto-rebase and push if needed
        if ! git rebase "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"; then
          git rebase --abort
          echo "ERROR: Rebase conflict on ${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}."
          echo "Please rebase manually and resolve conflicts."
          exit 1
        fi
      fi
      # HEADERS SETUP
    - utils/scripts/header_setup/replace_all.sh
    - git add -u
    - git commit -m "Headers added" || true
      # CODE FORMAT
    - mvn -U clean validate
    - compss/programming_model/bindings/python/scripts/style/apply_black.sh
    - git add -u
    - git commit -m "Code formatted" || true
    - | # GIT PUSH
      git fetch origin "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
      if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}")" ]; then
        if [ "${CI_MERGE_REQUEST_SOURCE_PROJECT_ID}" != "${CI_PROJECT_ID}" ]; then
          echo "ERROR: Header setup, code format and/or style check failed."
          echo "Please run locally these commands:"
          echo "$ utils/scripts/header_setup/replace_all.sh"
          echo "$ mvn -U clean validate"
          echo "$ compss/programming_model/bindings/python/scripts/style/apply_black.sh"
          echo "Commit fixes and push again."
          exit 1
        fi
        git push -f origin "HEAD:${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
        echo "Fixes commited and pushed. Triggering now another pipeline."
        exit 1
      fi
      # STYLE CHECK
    - compss/programming_model/bindings/python/scripts/style/check_code.sh
    - compss/programming_model/bindings/python/scripts/style/check_documentation.sh

test:
  stage: test
  extends:
    - .gitlab_registry
    - .merge_request
  variables:
    BRANCH_NAME: "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
    COMPSS_IMAGE: "${TESTS_IMAGE}:${BRANCH_NAME}"
  parallel:
    matrix:
      # Families split across 4 parallel jobs, balanced with longest-processing-
      # time-first using the per-family Jenkins timings shown below. The two big
      # single families (python, java) are additionally sharded into TEST_SHARDS
      # containers running in parallel on the same runner (tests.py --shard), so
      # the overall makespan is bounded by the packed family jobs (~26-27 min).
      #
      # python ~40 min sequential; ~20 min in 2 shards. Tests spend most of
      # their time in runtime start/stop, so two concurrent shards don't
      # contend on CPU, and each shard container is fully isolated (own
      # network namespace, /root and /tmp volumes).
      - TEST_FAMILIES: "-f python"
        TEST_SHARDS: "2"
      # java ~30 min sequential after test speedups; ~13-17 min in 2 shards (the
      # heavy tests cluster on even family numbers, so the split is uneven but
      # still a big win).
      - TEST_FAMILIES: "-f java"
        TEST_SHARDS: "2"
      # cloud ~14 + fault_tolerance ~5 + pscos ~5 + agents_transfers ~3 = ~27 min
      # estimated, sequential. Shard it like the other family groups above.
      - TEST_FAMILIES: "-f cloud -f fault_tolerance -f pscos -f agents_transfers"
        TEST_SHARDS: "2"
      # c ~10 + tools ~6 + agents ~5 + performance ~3 + socket ~1 + gos ~1 = ~26 min
      # estimated, but runs sequentially in practice (~33 min observed) since it
      # was never sharded like python/java above. Shard it the same way.
      - TEST_FAMILIES: "-f c -f tools -f agents -f performance -f socket -f gos -f concurrency"
        TEST_SHARDS: "2"
  script:
    # Mirror the whole runner-level trace (docker pull, shard invocations, cleanup)
    # into job.log, since GitLab's own job console has a size cap and truncates
    # long jobs — job.log is the durable, complete record.
    - exec &> >(tee job.log)
    - !reference [.docs_only_skip, script]
    - docker pull "${COMPSS_IMAGE}"
    - |
      : "${TEST_SHARDS:=1}"
      for s in $(seq 1 "${TEST_SHARDS}"); do
        export COMPSS_CONTAINER="${BRANCH_NAME}_${CI_JOB_ID}_${s}"
        tests/scripts/docker_test -FF ${TEST_FAMILIES} --shard ${s}/${TEST_SHARDS} &> "docker_test_s${s}.log" &
        pids="${pids} $!"
      done
      for p in ${pids}; do wait "${p}" || exit 1; done
  after_script:
    # after_script runs in a fresh shell, so job.log needs to be re-attached (append mode).
    # tee, not a plain redirect, so the tail'd test-results summary below still
    # streams to the live GitLab job console instead of only landing in job.log.
    - exec &> >(tee -a job.log)
    - |
      : "${TEST_SHARDS:=1}"
      for s in $(seq 1 "${TEST_SHARDS}"); do
        export COMPSS_CONTAINER="${BRANCH_NAME}_${CI_JOB_ID}_${s}"
        tail -n "$(tac "docker_test_s${s}.log" | grep -nm 1 '*** RUNNING' | cut -f1 -d:)" "docker_test_s${s}.log" || true
        docker cp "${COMPSS_CONTAINER}":/root/tests_execution_sandbox/logs . &> /dev/null || true
        docker rm -fv "${COMPSS_CONTAINER}" &> /dev/null || true
      done
    - docker rmi "${COMPSS_IMAGE}" &> /dev/null || true
  artifacts:
    name: "${BRANCH_NAME}_${CI_JOB_ID}"
    when: always
    expire_in: 1 week
    paths:
      - job.log
      - docker_test*.log
      - logs

clean:
  stage: deploy
  extends:
    - .gitlab_registry
  script:
    - MERGED_BRANCH="$(git log -1 --pretty=%B | grep "^Merge branch" | cut -f2 -d\')"
    - docker buildx imagetools create --prefer-index=false -t "${CACHE_IMAGE}:${CI_DEFAULT_BRANCH}" "${CACHE_IMAGE}:${MERGED_BRANCH}"
    - docker buildx imagetools create --prefer-index=false -t "${TESTS_IMAGE}:${CI_DEFAULT_BRANCH}" "${TESTS_IMAGE}:${MERGED_BRANCH}"
    - REPOSITORY_IDS="$(curl -sf --header "JOB-TOKEN:${CI_JOB_TOKEN}" "${REGISTRY_API}")"
    - CACHE_ID=$(jq --arg LOCATION "${CACHE_IMAGE}" '.[] | select(.location == $LOCATION) | .id' <<< "${REPOSITORY_IDS}")
    - TESTS_ID=$(jq --arg LOCATION "${TESTS_IMAGE}" '.[] | select(.location == $LOCATION) | .id' <<< "${REPOSITORY_IDS}")
    - curl -X DELETE --header "JOB-TOKEN:${CI_JOB_TOKEN}" "${REGISTRY_API}/${CACHE_ID}/tags/${MERGED_BRANCH}"
    - curl -X DELETE --header "JOB-TOKEN:${CI_JOB_TOKEN}" "${REGISTRY_API}/${TESTS_ID}/tags/${MERGED_BRANCH}"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

#######################
# CONTINUOUS DELIVERY #
#######################

again:
  needs: []
  extends:
    - test
  variables:
    BRANCH_NAME: "${CI_COMMIT_BRANCH}"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      allow_failure: true

version:
  stage: .pre
  script:
    - | # CHECK FORMAT
      [[ "${CI_COMMIT_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.-]+)?$ ]] ||
        { echo "Error: tag ${CI_COMMIT_TAG} does not match the expected pattern 'vMAJOR.MINOR.PATCH[-LABEL]'." >&2 && exit 1; }
    - VERSION="${CI_COMMIT_TAG#v}"
    - git remote set-url origin "https://oauth2:${CI_PUSH_TOKEN}@${CI_REPOSITORY_URL#*@}"
      # HEADERS SETUP
    - utils/scripts/header_setup/replace_all.sh
    - git add -u
    - git commit -m "Headers added" || true
      # UPDATE VERSION
    - utils/scripts/release/update_version.sh "${VERSION}"
    - git add -u
    - git commit -m "Version updated" || true
    - | # GIT PUSH
      BRANCH_NAME="${VERSION%%-*}"
      git fetch origin "${BRANCH_NAME}"
      if [ "$(git rev-parse HEAD)" != "$(git rev-parse "tags/${CI_COMMIT_TAG}^{commit}")" ]; then
        git push -f origin "HEAD:${BRANCH_NAME}" "HEAD:tags/${CI_COMMIT_TAG}"
        echo "Fixes commited and pushed. Triggering now another pipeline."
        exit 1
      fi
      # DEPLOY ARTIFACTORY
    - utils/scripts/release/mvn_deploy_tag.sh "${CI_COMMIT_TAG}" true
  rules:
    - if: $CI_COMMIT_TAG

supercomputers:
  stage: build
  timeout: 2h
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  parallel:
    matrix:
      - SCRIPT: "mn5/buildMN5"
        TARGET: "GPP/COMPSs"
      - SCRIPT: "mn5_acc/buildMN5_acc"
        TARGET: "ACC/COMPSs"
      - SCRIPT: "nord4/buildNord4"
        TARGET: "COMPSs"
  script:
    - exec &> >(tee job.log)
    - builders/scs/${SCRIPT} compss /home/genu/compss/tmpCOMPSs/ "/apps/${TARGET}/${CI_COMMIT_REF_NAME}" ${CI_COMMIT_REF_NAME}
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - job.log
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_TAG

images:
  stage: build
  timeout: 8h
  tags:
    - fast-docker
  before_script:
    - docker run --privileged --rm tonistiigi/binfmt --install all
    - |
      if [[ "${CI_COMMIT_TAG}" == *-* ]]; then
        echo "Login to GitLab registry to upload COMPSs "${CI_COMMIT_TAG}" pre-release images."
        docker login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
      else
        echo "Login to Docker Hub registry to upload COMPSs "${CI_COMMIT_TAG}" final images."
        docker login -u "${CD_REGISTRY_USER}" -p "${CD_REGISTRY_PASSWORD}"
      fi
  script:
    - exec &> >(tee job.log)
    - ARCHS=amd,arm,riscv TAGS="${CI_COMMIT_TAG}",latest docker bake --no-cache --push release
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - job.log
  rules:
    - if: $CI_COMMIT_TAG

packages:
  stage: build
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - builders/buildpackages "${VERSION}"
    - scp "builders/packages/sc/COMPSs_${VERSION}.tar.gz" bsccs1000.int.bsc.es:/srv/repo/sc/stable/
    - ssh bsccs1000.int.bsc.es chown wwwrun:www "/srv/repo/sc/stable/COMPSs_${VERSION}.tar.gz"
    - | # PIP UPDATE
      [[ "${CI_COMMIT_TAG}" == *-* ]] || twine upload "builders/packages/pip/pyCOMPSs/dist/pycompss-${VERSION}.tar.gz"
  rules:
    - if: $CI_COMMIT_TAG

deploy:
  stage: deploy
  script:
    - echo "COMPSs ${CI_COMMIT_TAG#v} released!"
  release:
    tag_name: ${CI_COMMIT_TAG}
    description: RELEASE_NOTES
  rules:
    - if: $CI_COMMIT_TAG