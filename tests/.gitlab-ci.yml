workflow:
  auto_cancel:
    on_job_failure: all
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_DRAFT == "true"'
      when: never
    - when: always

variables:
  CONTAINER_NAME: "compss_test_$CI_JOB_ID"
  COMPSS_IMAGE: "$CI_REGISTRY_IMAGE/ci:$CI_PIPELINE_ID"
  DEPS_IMAGE: $CI_REGISTRY_IMAGE/deps:latest
  TEST_DEPS_IMAGE: $CI_REGISTRY_IMAGE/test-deps:latest

# Reusable script snippets spliced into jobs via `!reference`. Keeping the
# registry login in one place avoids drift between the docker jobs that all
# log in to the registry. Disk cleanup is handled out-of-band by an age-based
# cron on each runner (compss-ci-docker-prune), NOT per-job: a per-pipeline
# prune deletes other concurrently-running pipelines' images and races their
# pulls (failed to lease content) on runners with concurrent > 1.
.ci_snippets:
  registry_login:
    # Retry with backoff: when several parallel jobs land on the same runner they
    # fire simultaneous TLS handshakes at the registry proxy, which occasionally
    # drops one ("net/http: TLS handshake timeout"). Absorb that transient burst
    # instead of failing the job. A genuine outage still fails after 5 attempts.
    - |
      n=0; until docker login -u gitlab-ci-token -p "$CI_JOB_TOKEN" "$CI_REGISTRY"; do
        n=$((n + 1)); [ "$n" -ge 5 ] && { echo "docker login failed after $n attempts"; exit 1; }
        echo "docker login attempt $n failed (transient registry/TLS); retrying in $((n * 3))s..."; sleep $((n * 3))
      done

stages:
  - rebase_verify
  - header_setup
  - docker_build
  - tests
  - cleanup

rebase_verify:
  stage: rebase_verify
  interruptible: true
  variables:
    GIT_DEPTH: 0
  script:
    - TARGET="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-trunk}"
    - SOURCE="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
    - git remote set-url origin "https://oauth2:${CI_PUSH_TOKEN}@gitlab.bsc.es/wdc/compss/framework.git"
    - git fetch origin "$TARGET"
    - |
      if [ "$CI_MERGE_REQUEST_SOURCE_PROJECT_ID" != "$CI_PROJECT_ID" ]; then
        # Fork MR: runner has no write access to source branch — verify only
        if ! git merge-base --is-ancestor "origin/$TARGET" HEAD; then
          echo "ERROR: Branch is not rebased on $TARGET. Please rebase and push again."
          exit 1
        fi
        echo "Branch is already rebased on $TARGET, proceeding"
      else
        # Same-repo MR: auto-rebase and push if needed
        git fetch origin "$SOURCE"
        git checkout -B "$SOURCE" "origin/$SOURCE"
        BEFORE=$(git rev-parse HEAD)
        if ! git rebase "origin/$TARGET"; then
          git rebase --abort
          echo "ERROR: Rebase conflict on $TARGET. Please rebase manually and resolve conflicts."
          exit 1
        fi
        if [ "$(git rev-parse HEAD)" != "$BEFORE" ]; then
          echo "Branch was not rebased on $TARGET, pushing rebase"
          git push origin "HEAD:$SOURCE"
          exit 1
        fi
        echo "Branch is already rebased on $TARGET, proceeding"
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

header_setup:
  stage: header_setup
  interruptible: true
  script:
    - git remote set-url origin "https://oauth2:${CI_PUSH_TOKEN}@gitlab.bsc.es/wdc/compss/framework.git"
    - git config user.email "ci@bsc.es"
    - git config user.name "COMPSs CI"
    - ./utils/scripts/header_setup/replace_all.sh
    - mvn -U clean validate
    - git add -u
    - |
      if ! git diff --cached --quiet; then
        if [ "$CI_MERGE_REQUEST_SOURCE_PROJECT_ID" != "$CI_PROJECT_ID" ]; then
          echo "ERROR: Files with missing headers detected. Please run utils/scripts/header_setup/replace_all.sh locally and push again."
          exit 1
        fi
        git commit -m "Add headers and format code"
        echo "Files with no headers detected, pushing commit"
        git push origin "HEAD:${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
        exit 1
      else
        echo "All files contained headers, proceeding"
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Builds and pushes the deps pre-image to the GitLab Container Registry.
# Only runs when the slow inputs change (apt/pip lists, git clone refs, or
# the pre-install-deps script), so Extrae/DLB compilation is cached across pipelines.
docker_build_deps:
  stage: docker_build
  interruptible: true
  tags:
    - fast-docker
  variables:
    DOCKER_BUILDKIT: "1"
  script:
    - !reference [.ci_snippets, registry_login]
    - docker pull "$DEPS_IMAGE" || true
    - docker build --build-arg BUILDKIT_INLINE_CACHE=1 --cache-from "$DEPS_IMAGE" --target deps -t "$DEPS_IMAGE" .
    - docker push "$DEPS_IMAGE"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - Dockerfile
        - builders/deps-versions
        - builders/pre-install-deps
        - .gitmodules
        - dependencies/dlb
        - dependencies/extrae
        - dependencies/kafka

# Builds and pushes the test-deps pre-image to the GitLab Container Registry.
# Only runs when tests/Dockerfile changes (apt packages, pip packages, Julia),
# so the slow installs are cached across pipelines.
docker_build_test_deps:
  stage: docker_build
  interruptible: true
  tags:
    - fast-docker
  services:
    - docker:dind
  variables:
    DOCKER_BUILDKIT: "1"
  script:
    - !reference [.ci_snippets, registry_login]
    - docker pull "$TEST_DEPS_IMAGE" || true
    - docker build --build-arg BUILDKIT_INLINE_CACHE=1 --cache-from "$TEST_DEPS_IMAGE" --target test-deps -t "$TEST_DEPS_IMAGE" tests/
    - docker push "$TEST_DEPS_IMAGE"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - tests/Dockerfile

docker_build:
  stage: docker_build
  interruptible: true
  tags:
    - fast-docker
  timeout: 1h
  services:
    - docker:dind
  needs:
    - job: rebase_verify
      optional: true
    - job: header_setup
      optional: true
    - job: docker_build_deps
      optional: true
    - job: docker_build_test_deps
      optional: true
  variables:
    DOCKER_BUILDKIT: "1"
    CI_BUILD_TAG: "ci-build:$CI_PIPELINE_ID"
  script:
    - !reference [.ci_snippets, registry_login]
    # Builder prune uses a 48h window so the Maven cache mount stays warm between pipelines.
    - docker builder prune --filter until=48h -f
    - |
      # Build the COMPSs installation (build stage) — used as 'build' context for tests/Dockerfile
      if docker pull "$DEPS_IMAGE"; then
        docker build --build-arg CI_DEPS_IMAGE="$DEPS_IMAGE" --build-arg BUILDKIT_CACHE_MOUNT_NS="$CI_COMMIT_REF_SLUG" --cache-from "$DEPS_IMAGE" --target build -t "$CI_BUILD_TAG" .
      else
        echo "WARN: deps image pull failed, building deps+build from scratch (this will be slow)"
        docker build --build-arg BUILDKIT_CACHE_MOUNT_NS="$CI_COMMIT_REF_SLUG" --target build -t "$CI_BUILD_TAG" .
      fi
    # Pull pre-built test-deps image if available; fall through to full build if not.
    - docker pull "$TEST_DEPS_IMAGE" || true
    - |
      if docker image inspect "$TEST_DEPS_IMAGE" &>/dev/null; then
        docker build --build-arg CI_BUILD_IMAGE="$CI_BUILD_TAG" --build-arg CI_TEST_DEPS_IMAGE="$TEST_DEPS_IMAGE" --build-arg BUILDKIT_CACHE_MOUNT_NS="$CI_COMMIT_REF_SLUG" -f tests/Dockerfile -t "$COMPSS_IMAGE" tests/
      else
        echo "WARN: test-deps image not found, building tests from scratch (this will be slow)"
        docker build --build-arg CI_BUILD_IMAGE="$CI_BUILD_TAG" --build-arg BUILDKIT_CACHE_MOUNT_NS="$CI_COMMIT_REF_SLUG" -f tests/Dockerfile -t "$COMPSS_IMAGE" tests/
      fi
    - docker push "$COMPSS_IMAGE"
    # Clean up temporary local build image
    - docker rmi "$CI_BUILD_TAG" 2>/dev/null || true
    - echo "Image successfully built"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"

tests:
  stage: tests
  interruptible: true
  timeout: 4h
  needs:
    - job: docker_build
  parallel:
    matrix:
      # Families split across 4 parallel jobs, balanced with longest-processing-
      # time-first using the per-family Jenkins timings shown below. The two big
      # single families (python, java) are additionally sharded into TEST_SHARDS
      # containers running in parallel on the same runner (tests.py --shard), so
      # the overall makespan is bounded by the packed family jobs (~26-27 min).
      #
      # python ~40 min sequential; ~20 min in 2 shards. Tests spend most of
      # their time in runtime start/stop, so two concurrent shards don't
      # contend on CPU, and each shard container is fully isolated (own
      # network namespace, /root and /tmp volumes).
      - TEST_FAMILIES: "-f python"
        TEST_SHARDS: "2"
      # java ~30 min sequential after test speedups; ~13-17 min in 2 shards (the
      # heavy tests cluster on even family numbers, so the split is uneven but
      # still a big win).
      - TEST_FAMILIES: "-f java"
        TEST_SHARDS: "2"
      # cloud ~14 + fault_tolerance ~5 + pscos ~5 + agents_transfers ~3 = ~27 min.
      - TEST_FAMILIES: "-f cloud -f fault_tolerance -f pscos -f agents_transfers"
      # c ~10 + tools ~6 + agents ~5 + performance ~3 + socket ~1 + gos ~1 = ~26 min.
      - TEST_FAMILIES: "-f c -f tools -f agents -f performance -f socket -f gos"
  script:
    - !reference [.ci_snippets, registry_login]
    - docker pull "$COMPSS_IMAGE"
    # Use the same docker_test script as Jenkins. COMPSS_CONTAINER is set to a
    # per-job (and per-shard) unique name so parallel jobs and shard containers
    # on the same runner don't collide.
    # COMPSS_IMAGE is already available from the global variables block.
    # Tee docker_test output to an artifact so the test runner pass/fail
    # summary is available even when the 4 MB job log is truncated.
    # $TEST_FAMILIES is intentionally unquoted so the shell word-splits
    # "-f python -f cloud ..." into separate arguments for docker_test.
    - mkdir -p test-results
    - |
      shards="${TEST_SHARDS:-1}"
      pids=""
      for i in $(seq 1 "$shards"); do
        if [ "$shards" -gt 1 ]; then
          shard_args="--shard $i/$shards"
          log_file="test-results/docker_test_shard${i}.log"
        else
          shard_args=""
          log_file="test-results/docker_test.log"
        fi
        ( set -o pipefail
          COMPSS_CONTAINER="${CONTAINER_NAME}_s${i}" \
            "$CI_PROJECT_DIR/tests/scripts/docker_test" -FF $TEST_FAMILIES $shard_args 2>&1 | tee "$log_file"
        ) &
        pids="$pids $!"
      done
      rc=0
      for pid in $pids; do wait "$pid" || rc=1; done
      exit $rc
  after_script:
    # Copy only the logs/ subtree: all *.outputlog, *.errorlog, runtime.log,
    # and job output files written by the test execution scripts go there.
    # apps/ contains only deployed binaries (jars, compiled C, xmls) and is
    # not needed for debugging failures. Test (app) numbers are globally
    # unique, so the per-shard log trees merge cleanly into one logs/ dir.
    - mkdir -p test-results
    - |
      for container in $(docker ps -a --format '{{.Names}}' | grep -E "^${CONTAINER_NAME}_s[0-9]+$"); do
        docker cp "$container":/root/tests_execution_sandbox/logs/. test-results/logs/ 2>/dev/null || true
        # docker rm -fv removes the container and its anonymous volumes (the
        # same three volumes that docker_test creates with --mount type=volume).
        docker rm -fv "$container" || true
      done
  artifacts:
    when: always
    name: "test-results-${CI_JOB_NAME}-${CI_PIPELINE_ID}"
    paths:
      - test-results/
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Deletes the per-pipeline ci image tag from the registry after tests complete
# to prevent unbounded registry growth. Runs even if tests failed.
# Registry size can be monitored at: Project > Packages & Registries > Container Registry
# A GitLab cleanup policy on the ci/* tags (TTL: 7 days) is also recommended as a safety net.
cleanup_registry:
  stage: cleanup
  script:
    - |
      REPO_ID=$(curl -sf --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/registry/repositories" | \
        python3 -c "
      import sys, json
      repos = json.load(sys.stdin)
      match = next((r['id'] for r in repos if r.get('path', '').endswith('/ci')), None)
      print(match if match is not None else '')
      ")
      if [ -z "$REPO_ID" ]; then
        echo "WARN: could not find ci registry repository, skipping cleanup"
        exit 0
      fi
      HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --request DELETE \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/registry/repositories/$REPO_ID/tags/$CI_PIPELINE_ID")
      if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "204" ]; then
        echo "Deleted registry tag ci:$CI_PIPELINE_ID"
      else
        echo "WARN: failed to delete registry tag ci:$CI_PIPELINE_ID (HTTP $HTTP_STATUS)"
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: always
