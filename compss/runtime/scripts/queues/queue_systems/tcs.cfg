LAUNCH_CMD="tcs_launch"  # Fugaku and Roquo
LAUNCH_PARAMS="" # this parameters were for srun. Are they the same for pjrsh?
LAUNCH_SEPARATOR=""
CMD_SEPARATOR=""
HOSTLIST_CMD="pjshowip"
HOSTLIST_TREATMENT="| awk '!a[\$0]++' | tr \"\n\" \" \""

# Runs a command on a node of the job, given its address in pjshowip. Workers
# are started with mpiexec, one process per node: within a job PJM runs one
# pjrsh at a time, and a worker's pjrsh only returns when the worker ends, so
# with pjrsh a run on several nodes never gets past its first worker. The
# node's virtual coordinate is its position in pjshowip.
tcs_launch(){
    local node=$1
    shift
    local index
    index=$(pjshowip | awk '!a[$0]++' | grep -n -x -F "${node}" | cut -d: -f1)
    if [ -z "${index}" ]; then
        pjrsh "${node}" "$@"
        return
    fi
    local coordinate
    coordinate=$(mktemp)
    echo "($((index - 1)))" > "${coordinate}"
    # The site's mpiexec wrapper (Fugaku's /opt/local/mpiexec), which jobs use
    # but a COMPSs job's PATH may lack; else the one in the PATH or the
    # toolchain's. Each process's output goes to ./output.<job>/ in files.
    local mpiexec=/opt/local/mpiexec/mpiexec
    if [ ! -x "${mpiexec}" ]; then
        mpiexec=$(command -v mpiexec || echo "${FJSVXTCLANGA}/bin/mpiexec")
    fi
    # With pjsub -X the job has the login node's environment, without the
    # MPI one a job normally gets; the site's mpiexec then exits with 1 and no
    # message. Give it the toolchain's MPI environment for this call only.
    local tcs=${FJSVXTCMPI:-${FJSVXTCLANGA:-$(ls -d /opt/FJSVxtclanga/tcsds-* | sort -V | tail -1)}}
    FJSVXTCMPI=${tcs} PATH=/opt/local/mpiexec:${tcs}/bin:${PATH} LD_LIBRARY_PATH=${tcs}/lib64:${LD_LIBRARY_PATH} \
        "${mpiexec}" -n 1 --vcoordfile "${coordinate}" "$@"
    local status=$?
    if [ ${status} -ne 0 ]; then
        echo "[TCS_LAUNCH] ${mpiexec} on ${node} ($(cat "${coordinate}")) from $(pwd) exited with ${status}" >&2
    fi
    rm -f "${coordinate}"
}

