workflow:
  auto_cancel:
    on_job_failure: all

stages:
  - check
  - build
  - tests
  - clean

variables:
  CACHE_IMAGE: "${CI_REGISTRY_IMAGE}/cache"
  TESTS_IMAGE: "${CI_REGISTRY_IMAGE}/tests"
  REGISTRY_API: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/registry/repositories"
#  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"

.mr:
  interruptible: true
  rules:
    - if: $CI_MERGE_REQUEST_DRAFT == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH

.docker:
  before_script:
    - docker login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"

check:
  stage: check
  extends:
    - .mr
  script:
    - git remote set-url origin "https://oauth2:${CI_PUSH_TOKEN}@${CI_REPOSITORY_URL#*@}"
    - | # REBASE
      git fetch origin "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
      if [ "$CI_MERGE_REQUEST_SOURCE_PROJECT_ID" != "$CI_PROJECT_ID" ]; then
        # Fork MR: runner has no write access to source branch — verify only
        if ! git merge-base --is-ancestor "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}" HEAD; then
          echo "ERROR: Branch is not rebased on ${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}. Please rebase and push again."
          exit 1
        fi
      else
        # Same-repo MR: auto-rebase and push if needed
        if ! git rebase "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"; then
          git rebase --abort
          echo "ERROR: Rebase conflict on ${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}. Please rebase manually and resolve conflicts."
          exit 1
        fi
      fi
    # HEADERS SETUP, CODE FORMAT & STYLE CHECK
    - ./utils/scripts/header_setup/replace_all.sh
    - git add -u
    - git commit -m "Headers added" || true
    - mvn -U clean validate
    - git add -u
    - git commit -m "Code formatted" || true
    - | # PUSH
      git fetch origin "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
      if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/${CI_COMMIT_REF_NAME}")" ]; then
        if [ "$CI_MERGE_REQUEST_SOURCE_PROJECT_ID" != "$CI_PROJECT_ID" ]; then
          echo "ERROR: Header setup, code format and/or style check failed."
          echo "Please run locally: utils/scripts/header_setup/replace_all.sh && mvn -U clean validate"
          echo "Commit fixes and push again."
          exit 1
        fi
        git push -f origin "HEAD:${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
        echo "Fixes commited and pushed. Triggering now another pipeline."
        exit 1
      fi

build:
  stage: build
  extends:
    - .mr
    - .docker
  tags:
    - fast-docker
  timeout: 1h
  script:
    - docker bake --set tests.cache-from=type=registry,ref="${CACHE_IMAGE}:${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
                  --set tests.cache-from=type=registry,ref="${CACHE_IMAGE}:${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
                  --set tests.cache-to=type=registry,ref="${CACHE_IMAGE}:${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}",mode=max
                  --set tests.tags="${TESTS_IMAGE}:${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
                  --push tests
    - docker rmi "${TESTS_IMAGE}:${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"

tests:
  stage: tests
  extends:
    - .mr
    - .docker
  timeout: 1h
  parallel:
    matrix:
      # Families split across 4 parallel jobs, balanced with longest-processing-
      # time-first using the per-family Jenkins timings shown below. The two big
      # single families (python, java) are additionally sharded into TEST_SHARDS
      # containers running in parallel on the same runner (tests.py --shard), so
      # the overall makespan is bounded by the packed family jobs (~26-27 min).
      #
      # python ~40 min sequential; ~20 min in 2 shards. Tests spend most of
      # their time in runtime start/stop, so two concurrent shards don't
      # contend on CPU, and each shard container is fully isolated (own
      # network namespace, /root and /tmp volumes).
      - TEST_FAMILIES: "-f python"
        TEST_SHARDS: "2"
      # java ~30 min sequential after test speedups; ~13-17 min in 2 shards (the
      # heavy tests cluster on even family numbers, so the split is uneven but
      # still a big win).
      - TEST_FAMILIES: "-f java"
        TEST_SHARDS: "2"
      # cloud ~14 + fault_tolerance ~5 + pscos ~5 + agents_transfers ~3 = ~27 min.
      - TEST_FAMILIES: "-f cloud -f fault_tolerance -f pscos -f agents_transfers"
      # c ~10 + tools ~6 + agents ~5 + performance ~3 + socket ~1 + gos ~1 = ~26 min.
      - TEST_FAMILIES: "-f c -f tools -f agents -f performance -f socket -f gos"
  variables:
    COMPSS_IMAGE: "${TESTS_IMAGE}:${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
  script:
    - docker pull "${COMPSS_IMAGE}"
    - |
      : "${TEST_SHARDS:=1}"
      for s in $(seq 1 "${TEST_SHARDS}"); do
        export COMPSS_CONTAINER="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}_${CI_JOB_ID}_s${s}"
        "${CI_PROJECT_DIR}/tests/scripts/docker_test" -FF ${TEST_FAMILIES} --shard ${s}/${TEST_SHARDS} &> "docker_test_s${s}.log" &
        pids="${pids} $!"
      done
      for p in ${pids}; do wait "${p}" || exit 1; done
  after_script:
    - |
      : "${TEST_SHARDS:=1}"
      for s in $(seq 1 "${TEST_SHARDS}"); do
        export COMPSS_CONTAINER="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}_${CI_JOB_ID}_s${s}"
        tail -n $(tac "docker_test_s${s}.log" | grep -nm 1 '*** RUNNING' | cut -f1 -d:) "docker_test_s${s}.log" || true
        docker cp ${COMPSS_CONTAINER}:/root/tests_execution_sandbox/logs . &> /dev/null || true
        docker rm -fv ${COMPSS_CONTAINER} &> /dev/null || true
      done
    - docker rmi ${COMPSS_IMAGE} &> /dev/null || true
  artifacts:
    name: "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}_${CI_JOB_ID}"
    when: always
    expire_in: 7 days
    paths:
      - docker_test*.log
      - logs

clean:
  stage: clean
  interruptible: false
  extends:
    - .docker
  tags:
    - fast-docker
  script:
    - MERGED_BRANCH=$(git log -1 --pretty=%B | grep "^Merge branch" | cut -f2 -d\')
    - docker bake --set tests.cache-from=type=registry,ref="${CACHE_IMAGE}:${MERGED_BRANCH}"
                  --set tests.cache-to=type=registry,ref="${CACHE_IMAGE}:${CI_DEFAULT_BRANCH}",mode=max
                  --set tests.tags="${TESTS_IMAGE}:${CI_DEFAULT_BRANCH}"
                  --push tests
    - docker rmi "${TESTS_IMAGE}:${CI_DEFAULT_BRANCH}"
    - REPOSITORY_IDS=$(curl -sf --header "JOB-TOKEN:${CI_JOB_TOKEN}" "${REGISTRY_API}")
    - CACHE_ID=$(jq --arg LOCATION "${CACHE_IMAGE}" '.[] | select(.location == $LOCATION) | .id' <<< "${REPOSITORY_IDS}")
    - TESTS_ID=$(jq --arg LOCATION "${TESTS_IMAGE}" '.[] | select(.location == $LOCATION) | .id' <<< "${REPOSITORY_IDS}")
    - curl -X DELETE --header "JOB-TOKEN:${CI_JOB_TOKEN}" "${REGISTRY_API}/${CACHE_ID}/tags/${MERGED_BRANCH}"
    - curl -X DELETE --header "JOB-TOKEN:${CI_JOB_TOKEN}" "${REGISTRY_API}/${TESTS_ID}/tags/${MERGED_BRANCH}"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH